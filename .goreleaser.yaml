version: 2
project_name: sboxkit

before:
  hooks:
    - go mod tidy

builds:
  - id: sboxkit
    main: ./cmd/sboxkit
    binary: sboxkit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # 精简包：只有 sboxkit 本体，是自更新下载的资产（internal/selfupdate 按
  # sboxkit_<version>_linux_<arch>.tar.gz 取用），保持体积小。
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - LICENSE
      - README.md
  # 用户模式安装包（第二种主流用法）：随包附带 sing-box 内核与基础 geo 规则集
  # （与 deb 同一份，由 scripts/fetch-deb-deps.sh 预下载），解压即可离线初始化；
  # sboxkit.user-mode 标记让服务以 systemd 用户单元运行，仅启用 TUN 时请求 sudo。
  - id: user-mode
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-user_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - src: packaging/user-mode/sboxkit.user-mode
        dst: .
        strip_parent: true
      - src: "packaging/deps/{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}/sing-box"
        dst: core
        strip_parent: true
        info:
          mode: 0755
      - src: packaging/deps/sing-box.version
        dst: core
        strip_parent: true
      - src: packaging/deps/rules/*.srs
        dst: ruleset
        strip_parent: true
      - src: packaging/copyright
        dst: licenses
        strip_parent: true
      - src: packaging/deps/LICENSE.sing-box
        dst: licenses
        strip_parent: true
      - src: scripts/user-*.sh
        dst: scripts
        strip_parent: true

nfpms:
  - id: deb
    package_name: sboxkit
    formats: [deb]
    vendor: Trilives
    homepage: https://github.com/Trilives/sboxkit
    maintainer: Trilives <trlives.j@gmail.com>
    description: |-
      Interactive TUI to deploy and manage sing-box on Linux.
      Bundles the sing-box core and basic geo rule-sets so the service can
      start offline right after installation; can be updated online later.
    license: MIT
    section: net
    contents:
      # sing-box 内核（GPL-3.0，见 copyright / LICENSE.sing-box）
      - src: packaging/deps/{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}/sing-box
        dst: /usr/libexec/sboxkit/sing-box
        file_info:
          mode: 0755
      - src: packaging/deps/sing-box.version
        dst: /usr/libexec/sboxkit/sing-box.version
      # 基础 geo 规则集种子：先能离线启动，之后可在线更新到最新版本
      - src: packaging/deps/rules/geosite-cn.srs
        dst: /usr/share/sboxkit/ruleset/geosite-cn.srs
      - src: packaging/deps/rules/geoip-cn.srs
        dst: /usr/share/sboxkit/ruleset/geoip-cn.srs
      # 许可与归属
      - src: packaging/copyright
        dst: /usr/share/doc/sboxkit/copyright
      - src: packaging/deps/LICENSE.sing-box
        dst: /usr/share/doc/sboxkit/LICENSE.sing-box

checksum:
  name_template: checksums.txt

# prerelease: auto 让打了 semver 预发布后缀的 tag（如 v0.1.7-beta.1）自动标记
# 为 GitHub prerelease：不会顶替"Latest release"，也不会被 /releases/latest
# 接口返回——self-update 的稳定渠道天然只看得到正式版，预览渠道另走 /releases
# 列表读取最新一项（见 internal/selfupdate）。
release:
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
