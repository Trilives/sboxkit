name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Prefetch bundled assets for deb + user-mode archive (sing-box core + geo rule-set seeds)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-deb-deps.sh
      - name: Test and check generated configs with the refreshed sing-box
        env:
          SING_BOX_BIN: ${{ github.workspace }}/packaging/deps/amd64/sing-box
        run: |
          go test ./...
          go vet ./...
      # checkout 最后以 +<sha>:refs/tags/<tag> 取回触发的标签，把附注标签换成了轻量标签，
      # %(contents) 因此读到的是提交信息；先强制取回标签对象本身。
      - name: Use annotated tag message as release notes
        run: |
          git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > /tmp/release-notes.md
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
